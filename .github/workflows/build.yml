# Tests on every change, and builds the Windows installer BAMS-Setup-<version>.exe.
# A tag v<version> (for example v2.2.0) also publishes the installer as a GitHub release.
# See docs/BUILD_AND_RELEASE.md.
name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the upgrade tests rebuild the first version of the program from the history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests (unit, convergence, several PCs)
        working-directory: tests
        run: python -m unittest test_unit test_convergence test_multinode

  windows-installer:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard
          choco upgrade innosetup -y --no-progress
      - name: Build BAMS.exe and the installer
        run: python tools/build_windows.py
      - name: Check that the built program starts and serves its pages
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP 'bams-home'
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          '{"port": 18080, "sync_port": 18443, "open_browser": false}' | Set-Content (Join-Path $home_dir 'config.json')
          $env:BAMS_HOME = $home_dir
          $p = Start-Process -FilePath build\bams_main.dist\BAMS.exe -ArgumentList '--background' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try {
              $s = Invoke-RestMethod http://127.0.0.1:18080/api/auth/status
              $page = (Invoke-WebRequest http://127.0.0.1:18080/ -UseBasicParsing).Content
              $js = (Invoke-WebRequest http://127.0.0.1:18080/js/app.js -UseBasicParsing).StatusCode
              if ($s.about.installed -and $page -match 'Break Area' -and $js -eq 200) { $ok = $true }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content (Join-Path $home_dir 'data\logs\server.log') -ErrorAction SilentlyContinue; throw 'BAMS.exe did not start correctly' }
          if (-not (Test-Path (Join-Path $home_dir 'data\auth.db'))) { throw 'data was not written to BAMS_HOME' }
          Write-Host 'BAMS.exe started and served its pages'
      - uses: actions/upload-artifact@v4
        with:
          name: BAMS-Setup
          path: dist/BAMS-Setup-*.exe
          retention-days: 30
      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/BAMS-Setup-*.exe --title "Break Area Management System $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
