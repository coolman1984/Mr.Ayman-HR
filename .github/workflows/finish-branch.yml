# Finish open branches into main. Never --admin, --delete-branch, or force-push.
# Each repo edits only STALE_MINUTES and ACTIVE_SINCE below.
name: Finish branch
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to finish
        required: true
        type: string
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write  # approve the PR check runs
concurrency:
  group: finish-branch
  cancel-in-progress: false
env:
  STALE_MINUTES: 60
  # Scheduled mode skips branches last committed before this, so old branches stay untouched.
  ACTIVE_SINCE: "2026-10-11T08:30:00Z"
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  finish:
    name: Finish branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Finish candidate branches
        run: |
          # The runner starts bash with -e. Turn that off so one branch cannot stop the rest.
          set +e
          set -uo pipefail
          export GH_PROMPT_DISABLED=1 GH_NO_UPDATE_NOTIFIER=1 GH_PAGER=cat
          log() { printf '%s\n' "$*" >&2; }
          SUM=""; ERR=""
          note() { SUM="${SUM}- $1"$'\n'; log "$1"; }
          err() { ERR="${ERR}- $1"$'\n'; log "ERROR: $1"; }
          # Percent-encode a branch so a slash stays one API path segment.
          enc() { jq -nr --arg s "$1" '$s|@uri'; }
          branch_sha() {
            local e out
            e=$(enc "$1") || return 1
            out=$(gh api "repos/${GH_REPO}/branches/${e}" --jq .commit.sha) || return 1
            printf '%s\n' "$out"
          }
          commit_date() { gh api "repos/${GH_REPO}/commits/$1" --jq .commit.committer.date; }
          ahead_by() { gh api "repos/${GH_REPO}/compare/main...$1" --jq .ahead_by; }
          same_merged() {
            local raw n
            raw=$(gh pr list -R "$GH_REPO" --state merged --head "$1" --base main --limit 5000 --json headRefOid,headRefName,isCrossRepository) || return 2
            # A full page may be truncated: unknown, never "not merged".
            [ "$(jq 'length' <<<"$raw")" -lt 5000 ] || return 2
            n=$(jq --arg sha "$2" --arg b "$1" '[.[]|select(.headRefOid==$sha and .headRefName==$b and (.isCrossRepository|not))]|length' <<<"$raw") || return 2
            [ "$n" != "0" ]
          }
          open_pr() {
            gh pr list -R "$GH_REPO" --state open --head "$1" --base main --limit 1000 --json number,isDraft,headRefName,labels,isCrossRepository \
              | jq -c --arg b "$1" '[.[]|select(.headRefName==$b and (.isCrossRepository|not))]|if length==0 then empty else .[0] end'
          }
          # ---- Hold guards (do-not-merge, stacks, release/installer). Every lookup fails CLOSED. ----
          # All open PRs of THIS repo (fork PRs ignored), refreshed before each decision.
          OPEN_PRS=""
          load_open_prs() {
            local raw
            raw=$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100") || return 1
            OPEN_PRS=$(jq -cs --arg repo "$GH_REPO" '[add // [] | .[]
                | select((.head.repo.full_name // "") == $repo)
                | {number, head: .head.ref, sha: .head.sha, base: .base.ref, armed: (.auto_merge != null),
                   dnm: any(.labels[]?; (.name|ascii_downcase) == "do-not-merge")}]' <<<"$raw") || return 1
            [ -n "$OPEN_PRS" ] || return 1
          }
          # Prints a reason when branch $1 (tip $2) must not be finished; empty = OK. Non-zero = unknown.
          held_reason() {
            local b="$1" sha="$2" r ob osha cmp st
            load_open_prs || return 1
            r=$(jq -r --arg b "$b" '[.[]|select(.head==$b)]
                | (map(select(.dnm))|if length>0 then "do-not-merge #\(.[0].number)" else empty end),
                  (map(select(.base!="main"))|if length>0 then "stacked on \(.[0].base) #\(.[0].number)" else empty end)' \
                <<<"$OPEN_PRS") || return 1
            [ -n "$r" ] && { printf '%s\n' "$r"; return 0; }
            # Child of another unmerged branch (stack): its parent's commits would land on main too.
            # Branch tips are read fresh for every gate, never from the start-of-run snapshot.
            local tips
            tips=$(gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv') || return 1
            [ -n "$tips" ] || return 1
            while IFS=$'\t' read -r ob osha; do
              [ -n "$ob" ] || continue
              case "$ob" in main|"$b") continue ;; esac
              # Shared history: the merge base of the two tips. If that base is not on main, this branch
              # carries commits of the other branch that main does not have (ahead, identical or diverged).
              if [ "$osha" = "$sha" ]; then cmp="$sha"
              else
                cmp=$(gh api "repos/${GH_REPO}/compare/$(enc "$osha")...$(enc "$sha")" --jq '[.status, .merge_base_commit.sha]|@tsv') || return 1
                # "behind": this branch is an ancestor of the other one (a parent checked against its child).
                # Its commits are its own, so the child does not hold it.
                [ "$(cut -f1 <<<"$cmp")" = "behind" ] && continue
                cmp=$(cut -f2 <<<"$cmp")
              fi
              [[ "$cmp" =~ ^[0-9a-f]{40}$ ]] || return 1
              st=$(ahead_by "$cmp") || return 1
              [[ "$st" =~ ^[0-9]+$ ]] || return 1
              [ "$st" -gt 0 ] || continue
              # A parent whose tip already landed through a merged PR (squash) is not "unmerged".
              same_merged "$ob" "$osha"; local smr=$?
              [ "$smr" -eq 2 ] && return 1
              [ "$smr" -eq 0 ] && continue
              printf 'contains unmerged commits of branch %s\n' "$ob"; return 0
            done <<<"$tips"
            return 0
          }
          # Release, installer and publishing changes always need the owner (case-insensitive).
          RELEASE_BRANCH_RE='^((release|releases|installer|installers)(/|$)|release[-_]v?[0-9]+(\.[0-9]+)*$|v[0-9]+(\.[0-9]+)+$)'
          RELEASE_PATH_RE='(^|/)([^/]*[-_.])?installers?([-_.][^/]*)?/|\.(iss|exe|msi|msix|msixbundle|nsi|nsh|wxs|appx|appxbundle|apk|aab)$|(^|/)build[-_]?windows\.py$|^\.github/workflows/finish-branch\.ya?ml$|^\.github/workflows/([^/]*[-_.])?(release|releases|publish|deploy|windows|installer)([-_.][^/]*)?\.ya?ml$'
          release_touch() {
            local b="$1" sha="$2" files hit gc
            if printf '%s\n' "$b" | grep -Eqi "$RELEASE_BRANCH_RE"; then printf 'release branch\n'; return 0; fi
            files=$(gh api "repos/${GH_REPO}/compare/main...$(enc "$sha")" \
              --jq 'if (.files|length)>=300 then "TOO-MANY-FILES" else (.files[]? | .filename, (.previous_filename // empty)) end') || return 1
            # GitHub lists at most 300 files: a longer list cannot be checked, so it is held (fail closed).
            [ "$files" = "TOO-MANY-FILES" ] && { printf '300+ files, cannot check\n'; return 0; }
            hit=$(printf '%s\n' "$files" | grep -Ei -m1 "$RELEASE_PATH_RE"); gc=$?
            [ "$gc" -le 1 ] || return 1
            [ -n "$hit" ] && printf '%s\n' "$hit"
            return 0
          }
          # Turn off auto-merge on EVERY own open PR from branch $1, then confirm it is off. Non-zero = still armed/unknown.
          disarm() {
            local b="$1" n ok=0
            load_open_prs || { err "disarm: cannot list PRs for ${b}"; return 1; }
            for n in $(jq -r --arg b "$b" '.[]|select(.head==$b and .armed)|.number' <<<"$OPEN_PRS"); do
              gh pr merge "$n" -R "$GH_REPO" --disable-auto >/dev/null || log "disable-auto failed on #${n}"
            done
            # shellcheck disable=SC2016  # GraphQL $variables, not shell
            # Also take each PR out of a merge queue, then verify it is neither armed nor queued.
            local q v vc
            for n in $(jq -r --arg b "$b" '.[]|select(.head==$b)|.number' <<<"$OPEN_PRS"); do
              q=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id isInMergeQueue autoMergeRequest{enabledAt}}}}' \
                -F o="${GH_REPO%/*}" -F r="${GH_REPO#*/}" -F n="$n" --jq '.data.repository.pullRequest|[.id,.isInMergeQueue]|@tsv'); vc=$?
              if [ "$vc" -ne 0 ] || [ -z "$q" ]; then err "disarm: cannot verify #${n} (${b})"; ok=1; continue; fi
              if [ "$(cut -f2 <<<"$q")" = "true" ]; then
                gh api graphql -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}' -F id="$(cut -f1 <<<"$q")" >/dev/null \
                  || log "dequeue failed on #${n}"
              fi
              v=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){isInMergeQueue autoMergeRequest{enabledAt}}}}' \
                -F o="${GH_REPO%/*}" -F r="${GH_REPO#*/}" -F n="$n" --jq '.data.repository.pullRequest|(.isInMergeQueue or (.autoMergeRequest!=null))'); vc=$?
              if [ "$vc" -ne 0 ] || [ "$v" != "false" ]; then err "auto-merge still armed or queued on #${n} (${b})"; ok=1
              else log "#${n} not armed, not queued"; fi
            done
            return "$ok"
          }
          # One gate for both checks. Prints a reason to hold; non-zero = unknown (treated as held).
          gate() {
            local r
            r=$(held_reason "$1" "$2") || return 1
            [ -n "$r" ] && { head -1 <<<"$r"; return 0; }
            r=$(release_touch "$1" "$2") || return 1
            [ -n "$r" ] && printf 'release/installer change needs the owner: %s\n' "$(head -1 <<<"$r")"
            return 0
          }

          # A PR opened by GITHUB_TOKEN starts its pull_request checks in "action_required"
          # (waiting for approval). Approve those runs so the required checks run on the PR.
          approve_checks() {
            local ids id i
            [ "$3" = "new" ] && sleep 30  # let GitHub create all PR runs first
            for i in 1 2 3 4 5 6; do
              ids=$(gh api "repos/${GH_REPO}/actions/runs?head_sha=${2}&event=pull_request&per_page=100" \
                --jq '.workflow_runs[] | select(.conclusion=="action_required") | .id') || return 1
              [ -n "$ids" ] || { [ "$3" = "new" ] && [ "$i" -lt 6 ] && sleep 15 && continue; return 0; }
              for id in $ids; do
                log "approve run ${id} on ${1}"
                gh api -X POST "repos/${GH_REPO}/actions/runs/${id}/approve" >/dev/null || return 1
              done
              return 0
            done
          }

          merge_pr() {
            local num="$1" hsha="$2" meta st efile mq
            : >"$msgf"
            meta=$(gh pr view "$num" -R "$GH_REPO" --json state,autoMergeRequest) \
              || { printf 'could not read PR #%s\n' "$num" >"$msgf"; return 1; }
            st=$(jq -r .state <<<"$meta")
            if [ "$st" = "MERGED" ]; then printf 'queued\n'; return 0; fi
            if [ "$st" != "OPEN" ]; then printf 'PR #%s is %s\n' "$num" "$st" >"$msgf"; return 1; fi
            # Auto-merge is never armed: it would merge later pushes or labels without a new check.
            # Merge only now, pinned to the head that just passed the gate; otherwise retry next run.
            # A merge queue on main would turn "merge now" into a delayed merge: hold for the owner.
            # shellcheck disable=SC2016  # GraphQL $variables, not shell
            mq=$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){mergeQueue(branch:"main"){id} pullRequest(number:$n){mergeStateStatus headRefOid}}}' \
              -F o="${GH_REPO%/*}" -F r="${GH_REPO#*/}" -F n="$num" \
              --jq '.data.repository|[(.mergeQueue!=null), .pullRequest.mergeStateStatus, .pullRequest.headRefOid]|@tsv') \
              || { printf 'could not read merge state of #%s\n' "$num" >"$msgf"; return 1; }
            [ "$(cut -f1 <<<"$mq")" = "false" ] || { printf 'main uses a merge queue; owner merges\n' >"$msgf"; return 4; }
            [ "$(cut -f3 <<<"$mq")" = "$hsha" ] || { printf 'head moved after the gate\n' >"$msgf"; return 3; }
            case "$(cut -f2 <<<"$mq")" in
              CLEAN|HAS_HOOKS) ;;
              BLOCKED|BEHIND|UNKNOWN|DRAFT|UNSTABLE) printf 'not mergeable yet (%s)\n' "$(cut -f2 <<<"$mq")" >"$msgf"; return 3 ;;
              *) printf 'merge state %s\n' "$(cut -f2 <<<"$mq")" >"$msgf"; return 1 ;;
            esac
            efile=$(mktemp)
            if gh pr merge "$num" -R "$GH_REPO" --squash --match-head-commit "$hsha" >"$efile" 2>&1; then
              rm -f "$efile"; printf 'squash\n'; return 0
            fi
            tr '\n' ' ' <"$efile" >"$msgf"; rm -f "$efile"; return 1
          }

          needs_fix() {
            local num="$1" sha="$2" has rows body list cfile
            has=$(gh pr view "$num" -R "$GH_REPO" --json labels --jq '[.labels[].name] | index("needs-fix")') || return 1
            if [ "$has" != "null" ]; then log "PR #${num} already has needs-fix"; return 0; fi
            rows=$(gh api --paginate "repos/${GH_REPO}/commits/${sha}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, .conclusion, (.html_url // "")] | @tsv') || return 1
            body=$(printf '%s\n' "$rows" | jq -Rs --arg run "${GITHUB_RUN_ID:-0}" '
              [split("\n")[] | select(length>0) | split("\t") | {name:.[0], status:.[1], conclusion:.[2], url:.[3]}]
              | map(select(.status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled" or .conclusion=="timed_out")))
              | map(select(((.url // "") | contains("/actions/runs/\($run)/") | not) and .name != "Finish branch"))
              | unique_by(.name)') || return 1
            [ "$(jq 'length' <<<"$body")" = "0" ] && return 0
            list=$(jq -r '.[] | "- [" + .name + "](" + .url + ")"' <<<"$body") || return 1
            gh pr edit "$num" -R "$GH_REPO" --add-label needs-fix || return 1
            cfile=$(mktemp)
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              "تعذّر الدمج التلقائي لأن الفحوصات التالية لم تنجح:" "$list" \
              "Automatic merge is blocked because these checks failed:" "$list" >"$cfile"
            if ! gh pr comment "$num" -R "$GH_REPO" --body-file "$cfile"; then
              rm -f "$cfile"
              gh pr edit "$num" -R "$GH_REPO" --remove-label needs-fix
              return 1
            fi
            rm -f "$cfile"
            return 2
          }

          finish_one() {
            local b="$1" sha="$2" sm pr num url how mc nf g cur fresh=old
            same_merged "$b" "$sha"; sm=$?
            if [ "$sm" -eq 2 ]; then err "merged-PR lookup failed for ${b}"; disarm "$b"; return 1; fi
            if [ "$sm" -eq 0 ]; then note "${b}: skipped (merged PR has this commit)"; return 0; fi
            if ! g=$(gate "$b" "$sha"); then err "hold check failed for ${b} (held)"; disarm "$b"; return 1; fi
            if [ -n "$g" ]; then note "${b}: skipped (${g})"; disarm "$b" || return 1; return 0; fi
            pr=$(open_pr "$b") || { err "open-PR lookup failed for ${b}"; return 1; }
            if [ -n "$pr" ]; then
              num=$(jq -r .number <<<"$pr")
              if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then note "${b}: skipped (draft #${num})"; return 0; fi
              if [ "$(jq -r 'any(.labels[]?; (.name|ascii_downcase)=="do-not-merge")' <<<"$pr")" = "true" ]; then
                disarm "$b" || return 1
                note "${b}: skipped (do-not-merge #${num})"; return 0
              fi
            else
              url=$(gh pr create -R "$GH_REPO" --base main --head "$b" --title "Auto-finish: ${b}" --body "$(printf '%s\n\n%s\n' \
                'فُتح هذا الطلب تلقائيًا لإتمام الفرع. يُدمج فقط إذا نجحت الفحوصات المطلوبة.' \
                'This pull request was opened automatically to finish the branch. It merges only if the required checks pass.')") \
                || { err "creating the PR failed for ${b}"; return 1; }
              num=${url##*/}
              [[ "$num" =~ ^[0-9]+$ ]] || { err "could not read the PR number for ${b} from ${url}"; return 1; }
              fresh=new
            fi
            # Re-check on the head that will actually merge; the merge is pinned to that commit.
            cur=$(gh api "repos/${GH_REPO}/pulls/${num}" --jq .head.sha) || { err "head lookup failed for #${num}"; disarm "$b"; return 1; }
            [[ "$cur" =~ ^[0-9a-f]{40}$ ]] || { err "bad head for #${num}"; disarm "$b"; return 1; }
            approve_checks "$b" "$cur" "$fresh" || { err "approving checks failed for ${b}"; return 1; }
            # Last hold check, after the approval wait and right before the (head-pinned) merge.
            if ! g=$(gate "$b" "$cur"); then err "pre-merge hold check failed for ${b} (held)"; disarm "$b"; return 1; fi
            if [ -n "$g" ]; then note "${b}: skipped before merge (${g})"; disarm "$b" || return 1; return 0; fi
            how=$(merge_pr "$num" "$cur"); mc=$?
            MERGE_MSG=$(cat "$msgf")
            if [ "$mc" -eq 1 ]; then
              err "${b} (#${num}): merge failed: ${MERGE_MSG:-unknown}"; note "${b}: merge failed (#${num})"
              return 1
            fi
            if [ "$mc" -eq 4 ]; then note "${b}: skipped (#${num}): ${MERGE_MSG}"; return 0; fi
            # Record failed checks on the head that was gated.
            if [ "$mc" -eq 3 ]; then
              needs_fix "$num" "$cur"; nf=$?
              if [ "$nf" -eq 2 ]; then note "${b}: needs-fix (#${num})"; return 0; fi
              if [ "$nf" -ne 0 ]; then err "${b} (#${num}): could not record needs-fix"; return 1; fi
            fi
            if [ "$mc" -eq 3 ]; then
              note "${b}: not mergeable yet, retry next run (#${num}): ${MERGE_MSG:-unknown}"; return 0
            fi
            if [ "$mc" -ne 0 ]; then
              err "${b} (#${num}): merge failed: ${MERGE_MSG:-unknown}"; note "${b}: merge failed (#${num})"
              return 1
            fi
            note "${b}: ${how} (#${num})"
          }

          mode="${GITHUB_EVENT_NAME:?}"
          cand=$(mktemp) || exit 1
          msgf=$(mktemp) || exit 1
          # This job never arms auto-merge or queues PRs. Any delayed merge left on an own open PR
          # (from older versions or by hand) is not pinned to a checked head: turn ALL of them off first.
          # shellcheck disable=SC2016  # GraphQL $variables, not shell
          if armed=$(gh api graphql --paginate -f query='query($o:String!,$r:String!,$endCursor:String){repository(owner:$o,name:$r){pullRequests(states:OPEN,first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{number headRefName isCrossRepository isInMergeQueue autoMergeRequest{enabledAt}}}}}' \
              -F o="${GH_REPO%/*}" -F r="${GH_REPO#*/}" \
              --jq '.data.repository.pullRequests.nodes[]|select((.isCrossRepository|not) and (.isInMergeQueue or .autoMergeRequest!=null))|.headRefName'); then
            for ab in $(sort -u <<<"$armed"); do note "${ab}: delayed merge turned off"; disarm "$ab" || true; done
          else
            err "listing armed/queued PRs failed: delayed merges not turned off"
          fi
          BRANCH_LIST=$(mktemp) || exit 1
          trap 'rm -f "$cand" "$msgf" "$BRANCH_LIST"' EXIT
          if ! gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv' >"$BRANCH_LIST"; then
            err "listing branches failed: nothing is finished this run"
            printf '## Finish branch\n\n### Errors\n%s' "$ERR" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          if [ "$mode" = "workflow_dispatch" ]; then
            b=$(jq -r '.inputs.branch // empty' "${GITHUB_EVENT_PATH:?}")
            if [ -z "$b" ]; then err "input branch is required"
            elif [ "$b" = "main" ]; then err "refusing to finish main"
            else
              sha=$(branch_sha "$b") || sha=""
              if [ -z "$sha" ]; then err "branch not found: ${b}"; else printf '%s\t%s\n' "$b" "$sha" >>"$cand"; fi
            fi
          else
            cutoff=$(date -u -d "-${STALE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ) || cutoff=""
            list="$BRANCH_LIST"
            if [ -z "$cutoff" ]; then err "could not compute the stale cutoff from STALE_MINUTES=${STALE_MINUTES}"
            else
              while IFS=$'\t' read -r name sha; do
                [ -n "$name" ] || continue
                case "$name" in main|dependabot/*) continue ;; esac
                d=$(commit_date "$sha") || { err "commit date failed for ${name}"; disarm "$name"; continue; }
                [[ "$d" < "$cutoff" && "$d" > "$ACTIVE_SINCE" ]] || continue
                a=$(ahead_by "$sha") || { err "compare failed for ${name}"; disarm "$name"; continue; }
                [[ "$a" =~ ^[0-9]+$ ]] || { err "bad ahead_by for ${name}: ${a}"; disarm "$name"; continue; }
                [ "$a" -gt 0 ] || continue
                printf '%s\t%s\n' "$name" "$sha" >>"$cand"
              done <"$list"
            fi
          fi
          while IFS=$'\t' read -r name sha; do
            [ -n "$name" ] || continue
            finish_one "$name" "$sha" || disarm "$name" || true
          done <"$cand"
          {
            printf '## Finish branch\n\nMode: %s\n\n' "$mode"
            if [ -n "$SUM" ]; then printf '%s' "$SUM"; else printf 'No candidate branches.\n'; fi
            if [ -n "$ERR" ]; then printf '\n### Errors\n%s' "$ERR"; fi
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$mode" = "workflow_dispatch" ] && [ -n "$ERR" ]; then exit 1; fi
          # Fail closed and visible: any error in a scheduled run turns the job red.
          if [ -n "$ERR" ]; then exit 1; fi
          exit 0
